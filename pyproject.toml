[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fil-harness"
version = "0.1.0"
description = "Local-first trusted control plane for coding agents"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
fil-harness = "agent_harness.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
